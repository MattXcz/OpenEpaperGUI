# Keep lint stable between local runs and CI. Without a config file ruff's
# defaults can change with a new release, which would turn CI red for reasons
# unrelated to the change under review.
line-length = 100
target-version = "py311"

[lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, UP: pyupgrade,
# B: bugbear, C4: comprehensions, SIM: simplify.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # Line length is enforced by the formatter, not by the linter.
    "E501",
]

[lint.per-file-ignores]
# Tests may use long literals and deliberately broad assertions.
"app/test_*.py" = ["B011"]
